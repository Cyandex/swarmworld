world:
  width: 48
  height: 36
  field_diffusion: 0.06
  resource_regrowth: 0.002
  disturbance_interval: 96
  disturbance_intensity: 0.45

population:
  agents: 8
  macro_interval: 16
  communication_radius: 6
  inventory_capacity: 12.0
  memory_capacity: 64

simulation:
  seed: 9331
  max_ticks: 128
  snapshot_interval: 32
  artifact_limit: 4096

server:
  host: 127.0.0.1
  port: 8765
  ticks_per_second: 8.0
  render_every: 1

llm:
  enabled: true
  base_url: http://127.0.0.1:8000/v1
  model: default
  api_key_env: BIOFOUNDRY_API_KEY
  concurrency: 1
  timeout_seconds: 600
  temperature: 0.0
  max_tokens: 4096
  max_plan_actions: 6
  call_budget: 64
  reasoning_effort: null
  structured_output: true
  experience_attention: true
  context_budget_characters: 60000
  freeze_on_provider_outage: true
  grammar_safe_numbers: true
  json_whitespace_logit_bias: -100.0
  tokenizer: google/gemma-4-12B-it
  tokenizer_local_files_only: true
  json_mode: false

science:
  enabled: true
  mission: open_habitat_resilience
  test_scale: 0.25
  target_material_utility: 0.30
  target_artifact_performance: 0.15
  target_behavioral_novelty: 0.08
  minimum_contributors: 2
  feedback_history: 8
  action_feedback: true
  immediate_replanning: true
  communication: true
  social_awareness: true
  shared_depot: true
  public_infrastructure_map: true
  global_landmarks: false
  experience_reuse: true
  request_tracking: true
  message_interrupts: false
  selective_replanning: true
